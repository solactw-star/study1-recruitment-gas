name: Manual GAS source sync (NOT public website deployment)
# PR #133 HEAD only. Never auto-trigger from a code push.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'I_AUTHORIZE_PR133_HEAD_ONLY_SYNC'
        required: true
        type: string
      reviewed_pr_sha:
        description: 'Exact 40-character current PR #133 HEAD'
        required: true
        type: string
      expected_remote_sha256:
        description: 'Exact reviewed GAS HEAD SHA-256'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: study1-gas-source-sync
  cancel-in-progress: false
jobs:
  head-only:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse unapproved branch, SHA or manual invocation
        env:
          REVIEWED_PR_SHA: ${{ inputs.reviewed_pr_sha }}
          EXPECTED_REMOTE_SHA256: ${{ inputs.expected_remote_sha256 }}
          HEAD_ONLY_CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = solactw-star/study1-recruitment-gas
          test "$GITHUB_REF" = refs/heads/fix/consent-last-preserve-wizard-20261110
          test "$GITHUB_REPOSITORY_PRIVATE" = true
          test "$HEAD_ONLY_CONFIRMATION" = I_AUTHORIZE_PR133_HEAD_ONLY_SYNC
          test "$REVIEWED_PR_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_REMOTE_SHA256" = 972cb7ceb617776ca161d283dd05e8f1d38b73b90afc68071b79eeffba25a611
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Full PR preflight; no skipped safety tests
        run: |
          npm run verify:pr
          node --check scripts/study1-gas-head-only-sync.cjs
          node --check gas/Website.js
      - name: Isolated original 828 OAuth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo 'OAuth unavailable: refusing sync'; exit 1; }
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          echo "CLASPRC_PATH=$RUNNER_TEMP/.clasprc.json" >> "$GITHUB_ENV"
      - name: GET original 27 sources, Drive owner-only backup and full readback
        env:
          REVIEWED_PR_SHA: ${{ inputs.reviewed_pr_sha }}
          EXPECTED_REMOTE_SHA256: ${{ inputs.expected_remote_sha256 }}
          HEAD_ONLY_CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/study1-gas-head-only-sync.cjs prepare
      - name: Reject PR branch competing commit before any remote PUT
        run: |
          git fetch origin fix/consent-last-preserve-wizard-20261110 --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'PR branch changed: no GAS mutation'
            exit 1
          }
      - name: Once-only full 27-file GAS HEAD PUT; verify; never deploy
        env:
          REVIEWED_PR_SHA: ${{ inputs.reviewed_pr_sha }}
          EXPECTED_REMOTE_SHA256: ${{ inputs.expected_remote_sha256 }}
          HEAD_ONLY_CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: node scripts/study1-gas-head-only-sync.cjs apply
      - name: Purge runner token cache and raw source snapshot
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/.clasprc.json"
          rm -f "$RUNNER_TEMP/study1-pr133-head-only-prewrite.json"
