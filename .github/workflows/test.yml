name: GAS static safety checks
on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/remote-baseline-20261029.json'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run closed-site security checks (no secrets)
        run: |
          npm test
          node --check gas/Website.js
