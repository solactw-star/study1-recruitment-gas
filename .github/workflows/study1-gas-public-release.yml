name: Study1 original GAS public CLOSED information release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/study1-gas-public-release.yml'
      - 'scripts/study1-gas-public-release.cjs'
      - 'tests/study1-public-release.test.cjs'
  workflow_run:
    workflows: ['Study1 GAS auto-sync approved closed site and admin sandbox']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: study1-gas-source-sync
  cancel-in-progress: false
jobs:
  publish-original-public-info:
    if: >-
      github.event.repository.private &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current approved main and complete CLOSED site tests
        run: |
          npm test
          node --check scripts/study1-gas-public-release.cjs
          node --check scripts/study1-gas-index-preview.cjs
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'Concurrent main update: public release blocked'
            exit 1
          }
      - name: Verify original current main AGAIN before any OAuth or deployment
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'Concurrent main update: no GAS mutation'
            exit 1
          }
      - name: Load original private 828 OAuth (never expose)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || {
            echo 'Existing 828 OAuth secret unavailable'
            exit 1
          }
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          echo "CLASPRC_PATH=$RUNNER_TEMP/.clasprc.json" >> "$GITHUB_ENV"
      - name: Create/update CLOSED public informational deployment, inspect anonymous routes and preserve original private owner deployment
        env:
          STUDY1_PUBLIC_INFO_RELEASE: OWNER_APPROVED_2026_11_09
          GITHUB_REPOSITORY_PRIVATE: 'true'
        run: node scripts/study1-gas-public-release.cjs
      - name: Clean original OAuth credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/.clasprc.json"
